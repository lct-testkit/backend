# Закрытый контур: всё поднимается одной командой и не требует интернета
# в рантайме. Наружу смотрит только Caddy.
#
#   docker compose up -d --build
#
# Стек зафиксирован спецификацией: PostgreSQL 16, Redis 7, SeaweedFS
# (MinIO запрещён), Keycloak 25, arq, Caddy.

name: rtk-crm

# Демо/прод-стенд живёт неделями без внешнего сборщика логов — без ротации
# json-file-драйвер Docker копит их на диске неограниченно (особенно Caddy:
# строка JSON на каждый запрос). 10 МБ × 3 файла на контейнер — этого хватает
# на просмотр недавней истории (docker compose logs), не разрастаясь без контроля.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-env: &api-env
  APP_PROFILE: ${APP_PROFILE:-demo}
  # Роль crm_app: только SELECT/INSERT на audit_log, без UPDATE/DELETE
  # (new_spec §3.3, GRANT-уровень) — не суперпользователь кластера crm/
  # POSTGRES_USER. Сервис `migrate` ниже переопределяет этот DATABASE_URL
  # обратно на суперпользователя: миграциям нужен DDL (CREATE ROLE/TABLE/
  # FUNCTION, GRANT), которого у crm_app сознательно нет.
  DATABASE_URL: postgresql+asyncpg://crm_app:${CRM_APP_PASSWORD:-crm_app}@postgres:5432/${POSTGRES_DB:-crm}
  # Читает `migrations/versions/0012_audit_role_hardening.py` (переиздаёт
  # `ALTER ROLE crm_app ... PASSWORD`), а также любой процесс, который
  # инстанцирует Settings — поле обязательное, значит нужно всем сервисам,
  # даже тем, что сам пароль не используют (он уже встроен в DATABASE_URL).
  CRM_APP_PASSWORD: ${CRM_APP_PASSWORD:-crm_app}
  KC_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-crm}@postgres:5432/keycloak
  REDIS_URL: redis://redis:6379/0
  BASE_URL: ${BASE_URL:-http://localhost:8080}
  # Публичный адрес задаёт issuer токенов, внутренний — путь для серверных
  # вызовов JWKS, token и Admin API внутри docker-сети.
  KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080/auth}
  KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:-crm}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-crm-bff}
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-crm-bff-secret}
  KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-crm-admin}
  KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-crm-admin-secret}
  # В поставляемом realm у клиента настроен audience-мэппер, поэтому проверка
  # `aud` включена. Выключать нельзя: без неё подойдёт любой токен realm'а,
  # выданный другому клиенту, и BFF-контур обходится целиком.
  KEYCLOAK_VERIFY_AUDIENCE: ${KEYCLOAK_VERIFY_AUDIENCE:-true}
  S3_ENDPOINT_URL: http://seaweedfs:8333
  # Presigned-ссылки разыменовывает браузер клиента, а не контейнеры —
  # внутренний docker-хостнейм seaweedfs ему не резолвится. Caddy
  # проксирует порт 8333 напрямую на seaweedfs (см. Caddyfile) — не через
  # префикс пути на :8080/:8443, потому что подпись SigV4 считается по
  # полному пути запроса и стрипинг префикса ломает проверку на SeaweedFS.
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:8333}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-crm_access}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-crm_secret_key}
  SIGNATURE_SERVER_SECRET: ${SIGNATURE_SERVER_SECRET:-change-me-in-prod}
  # dop.md §13 добавляет `ntp`/`sms-gateway-mock` в карту контейнеров (§2.2)
  # как часть этого же стека, а не опциональную внешнюю интеграцию — сетевые
  # имена зашиты напрямую, тем же приёмом, что S3_ENDPOINT_URL выше
  # (не `${...}` с пустым дефолтом-«выключено», как у LMS_BASE_URL/Bitrix).
  NTP_HOST: ntp
  SMS_GATEWAY_URL: http://sms-gateway-mock:8090
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-true}
  # Раздел 4.14/7.8: до спринта 9 эти шесть переменных были объявлены в
  # `Settings`/`.env.example` (часть — ещё в спринте 7), но ни одна не
  # была прокинута через этот anchor — живая проверка спринта 9 поймала,
  # что `Settings().bitrix_connector_enabled`/`cms_webhook_secret_ref` и
  # соседи внутри контейнера всегда были дефолтными (`False`/`None`)
  # независимо от `.env`, потому что этот whitelist, а не `.env` целиком,
  # определяет, что реально долетает до процесса.
  CMS_WEBHOOK_SECRET_REF: ${CMS_WEBHOOK_SECRET_REF:-}
  LMS_BASE_URL: ${LMS_BASE_URL:-}
  LMS_AUTH_REF: ${LMS_AUTH_REF:-}
  BITRIX_CONNECTOR_ENABLED: ${BITRIX_CONNECTOR_ENABLED:-false}
  BITRIX_WEBHOOK_URL_REF: ${BITRIX_WEBHOOK_URL_REF:-}
  INTEGRATION_WEBHOOK_RATE_LIMIT_PER_MIN: ${INTEGRATION_WEBHOOK_RATE_LIMIT_PER_MIN:-60}
  # Значения секретов, на которые ссылаются `credentials_ref`/`*_REF` выше
  # (раздел 7.8: в БД — только имя переменной, значение — здесь). Набор
  # фиксированный и пополняется по мере подключения реальных источников —
  # тот же принцип, что уже применён к `SIGNATURE_SERVER_SECRET`/
  # `S3_SECRET_KEY` этим же anchor'ом.
  CMS_WEBHOOK_SECRET: ${CMS_WEBHOOK_SECRET:-}
  BITRIX_WEBHOOK_URL: ${BITRIX_WEBHOOK_URL:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      # Нужна для корректной сортировки русских названий.
      LANG: ru_RU.utf8
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
      # Логируем медленные запросы: пригодится на нагрузочном тестировании.
      - -c
      - log_min_duration_statement=500
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Отдельная БД для Keycloak создаётся при первом запуске.
      - ./deploy/postgres/init-keycloak-db.sh:/docker-entrypoint-initdb.d/10-keycloak.sh:ro
    # 5433, потому что на хосте 5432 часто уже занят локальным Postgres / pgAdmin.
    # В pgAdmin: localhost:5433, база crm, пользователь crm, пароль crm.
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crm}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
    networks: [crm]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      # Сессии и идемпотентность терять нельзя, поэтому вытесняем только
      # ключи с выставленным TTL.
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging
    networks: [crm]

  seaweedfs:
    # S3-совместимое хранилище. Спецификация прямо запрещает замену на MinIO.
    image: chrislusf/seaweedfs:3.68
    restart: unless-stopped
    command: >
      server
      -dir=/data
      -master.volumeSizeLimitMB=1024
      -volume.max=100
      -s3
      -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - seaweed_data:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # Именно 127.0.0.1, а не localhost: в контейнере localhost резолвится
      # ещё и в ::1, wget выбирает IPv6, а SeaweedFS слушает только IPv4.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *logging
    networks: [crm]

  ntp:
    # dop.md §13/§10.8: «внутренний NTP обязателен в compose» — доверенное
    # время подписания сверяется реальным NTP-запросом (`signing.trusted_time`),
    # а не системными часами контейнера api. chrony внутри образа фолбэчится
    # на собственные часы (`local stratum 10`), когда внешние NTP-серверы
    # недостижимы — ожидаемо и корректно для закрытого контура без
    # интернета: здесь важен сам факт независимого, опрашиваемого по
    # протоколу источника времени, а не привязка к конкретному эталону
    # (в проде клиент разворачивает эту роль на реальный NTP предприятия).
    image: cturra/ntp:latest
    restart: unless-stopped
    cap_add:
      - SYS_TIME
      - NET_BIND_SERVICE
    logging: *logging
    networks: [crm]

  sms-gateway-mock:
    # dop.md §13: мок внешнего SMS-провайдера для доставки OTP (dop.md
    # §10.11) в закрытом контуре — `app/mocks/sms_gateway.py`, тот же образ,
    # что api/worker (см. entrypoint.sh), отдельная команда.
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sms-gateway-mock"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/health/live', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *logging
    networks: [crm]

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    restart: unless-stopped
    command:
      - start
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-crm}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      KC_HTTP_ENABLED: "true"
      # Keycloak живёт под /auth, чтобы весь контур был на одном порту Caddy.
      KC_HTTP_RELATIVE_PATH: /auth
      # Фиксируем публичный frontend-URL: иначе issuer токена зависел бы от
      # того, обратились к Keycloak через Caddy или напрямую из docker-сети.
      KC_HOSTNAME_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080/auth}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    # В образе нет ни curl, ни wget, поэтому стучимся по /dev/tcp из bash.
    # KC_HEALTH_ENABLED поднимает health на management-порту 9000, причём
    # KC_HTTP_RELATIVE_PATH действует и там: путь именно /auth/health/ready.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging
    networks: [crm]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["migrate"]
    environment:
      <<: *api-env
      # DDL (CREATE ROLE/TABLE/FUNCTION, GRANT) требует суперпользователя —
      # crm_app сознательно лишена этих прав той же миграцией, которая её
      # заводит (0002_identity_sprint, ужесточена в 0012_audit_role_hardening).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-crm}@postgres:5432/${POSTGRES_DB:-crm}
      WAIT_FOR_POSTGRES: postgres:5432
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *logging
    networks: [crm]

  seed:
    # Демо-воронки b2b_university_v1 и b2c_individual_v1 (раздел 7).
    # Идемпотентно, поэтому безопасно на каждом `docker compose up`.
    build:
      context: .
      dockerfile: Dockerfile
    command: ["seed"]
    environment:
      <<: *api-env
      WAIT_FOR_POSTGRES: postgres:5432
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    logging: *logging
    networks: [crm]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["api"]
    restart: unless-stopped
    environment:
      <<: *api-env
      WAIT_FOR_POSTGRES: postgres:5432
      WAIT_FOR_REDIS: redis:6379
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Приложение переживает недоступность Keycloak (JWKS подтягивается
      # лениво), но ждём его здесь, чтобы после `docker compose up` вход
      # работал сразу, а не через минуту.
      keycloak:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    logging: *logging
    networks: [crm]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["worker"]
    restart: unless-stopped
    environment:
      <<: *api-env
      WAIT_FOR_POSTGRES: postgres:5432
      WAIT_FOR_REDIS: redis:6379
    # Образ общий с api, где HEALTHCHECK проверяет HTTP-порт. Воркер HTTP не
    # слушает, поэтому переопределяем: arq --check читает свой heartbeat в Redis.
    healthcheck:
      test: ["CMD", "arq", "app.worker.main.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    logging: *logging
    networks: [crm]

  caddy:
    # Единая точка входа и TLS-терминация. Проставляет X-Request-Id,
    # который затем проходит через логи, аудит и тело ошибок.
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${HTTPS_PORT:-8443}:8443"
      # Presigned PUT/GET к SeaweedFS (см. комментарий у S3_PUBLIC_ENDPOINT_URL
      # выше и в Caddyfile) — единственное сознательное исключение из
      # «наружу только 443», по той же логике, что и POSTGRES_PORT ниже.
      - "${S3_PROXY_PORT:-8333}:8333"
    environment:
      # Origin S3-прокси (тот же адрес, что в presigned-ссылках): попадает в CSP страниц.
      S3_ORIGIN: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:8333}
      # Куда Caddy отдаёт всё, что не /api, /public, /health и не /auth: образ `web` (профиль web)
      # или, в разработке, Vite на хосте (WEB_UPSTREAM=host.docker.internal:5273).
      WEB_UPSTREAM: ${WEB_UPSTREAM:-web:3000}
      CSP_SCRIPT_SRC: ${CSP_SCRIPT_SRC:-'self'}
      # Имя TLS-сайта (SNI сертификата `tls internal`) в Caddyfile — раньше
      # объявлялась в .env.example, но не пробрасывалась сюда, поэтому смена
      # значения не имела эффекта и сайт всегда использовал дефолт localhost.
      CRM_TLS_HOST: ${CRM_TLS_HOST:-localhost}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Проверяем через себя же: так healthcheck подтверждает и конфиг Caddy,
    # и доступность api вверх по цепочке. Admin API выключен, проверять там нечего.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      - api
      - keycloak
    logging: *logging
    networks: [crm]

  web:
    # Веб-клиент: статический SPA (SvelteKit, adapter-static) за тем же Caddy. Собирается из соседнего
    # репозитория `frontend`; включается профилем: docker compose --profile web up -d --build
    profiles: ["web"]
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # demo — экран входа предлагает выбрать демо-учётку; prod — только вход через Keycloak.
      APP_MODE: ${APP_MODE:-demo}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-crm}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-crm-bff}
    logging: *logging
    networks: [crm]

volumes:
  postgres_data:
  redis_data:
  seaweed_data:
  caddy_data:
  caddy_config:

networks:
  crm:
    driver: bridge
