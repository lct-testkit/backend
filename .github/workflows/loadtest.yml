name: loadtest

# Нагрузочный гейт по критерию успеха №1 паспорта проекта: p95 ≤ 300 мс при 50 RPS
# для «перехода по статусу» и «добавления комментария» (Locust, loadtest/).
#
# Запускается: ночью, вручную (можно менять нагрузку) и на PR с меткой `perf`.
# Стек собирается из исходников PR (docker compose --build), поэтому гейт
# проверяет именно изменённый код. Порог задаётся в loadtest/run_ci.sh.
#
# Замечание о честности: shared-раннер GitHub слабее выделенного стенда; если
# гейт краснеет по достигнутому RPS, а не по p95 — раннеру не хватило мощности,
# это сигнал перенести прогон на выделенную машину, а не ослаблять порог.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      users:
        description: "Виртуальных пользователей"
        default: "50"
      rps_per_user:
        description: "RPS на пользователя (итого users × rps)"
        default: "1"
      duration:
        description: "Длительность каждого сценария"
        default: "90s"
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: loadtest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  loadtest:
    name: нагрузка (p95 ≤ 300 мс при 50 RPS)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LOADTEST_USERS: ${{ github.event.inputs.users || '50' }}
      LOADTEST_RPS_PER_USER: ${{ github.event.inputs.rps_per_user || '1' }}
      LOADTEST_DURATION: ${{ github.event.inputs.duration || '90s' }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - run: pip install --require-hashes -r requirements-dev.lock

      - run: cp .env.example .env

      - name: Поднять стек из исходников
        run: docker compose up -d --build --wait --wait-timeout 420

      - name: Нагрузка + проверка SLO
        run: bash loadtest/run_ci.sh

      - name: Результаты
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loadtest-results
          path: loadtest/results/
          retention-days: 14

      - name: Логи стека при падении
        if: failure()
        run: docker compose logs --no-color --tail 80 api worker keycloak

      - name: Остановить стек
        if: always()
        run: docker compose down -v
