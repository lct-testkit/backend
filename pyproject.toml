[project]
name = "rtk-crm-api"
version = "0.1.0"
description = "CRM ИТ Школы Ростелекома — бэкенд (модульный монолит)"
requires-python = ">=3.12,<3.15"
dependencies = [
    # Trivy: CVE-2025-62727/CVE-2026-48818/CVE-2026-54283 в starlette
    # (транзитивная зависимость fastapi). 0.115.6 ограничивает starlette
    # <0.51.0 — фикс только в 1.x, поэтому апгрейд starlette требует
    # апгрейда самого fastapi.
    "fastapi==0.141.1",
    "uvicorn[standard]==0.34.0",
    # pydantic 2.10.4 pins pydantic-core 2.27.2, которая не публикует колёса
    # для CPython 3.14 (PyO3 в этой версии не знает о нём) — сборка из
    # исходников падает на `maturin`. 2.13.5 подтянет pydantic-core 2.46.5,
    # у которой колёса под 3.14 уже есть.
    "pydantic==2.13.5",
    "pydantic-settings==2.7.1",
    # EmailStr в схемах администрирования пользователей.
    "email-validator==2.2.0",
    # Аналогично pydantic: 2.0.36 не публикует колёса под 3.14, 2.0.54 — публикует.
    "sqlalchemy[asyncio]==2.0.54",
    # 0.30.0 не публикует колёса под 3.14, 0.31.0 — публикует.
    "asyncpg==0.31.0",
    "alembic==1.14.0",
    "redis==5.2.1",
    "httpx==0.28.1",
    # Trivy: CVE-2026-48526 (обход аутентификации через подделанный JWT).
    "pyjwt[crypto]==2.13.0",
    "structlog==24.4.0",
    "prometheus-client==0.21.1",
    "arq==0.26.3",
    # Trivy: CVE-2026-24486/CVE-2026-42561/CVE-2026-53539.
    "python-multipart==0.0.30",
    "swagger-ui-bundle==1.1.0",
    # Presigned PUT/GET к SeaweedFS (раздел 9): boto3/botocore чистый Python,
    # версии CPython их не касаются.
    "boto3==1.43.96",
    # Импорт каталогов и локальный реестр ЕГРЮЛ (раздел 5.11/§4.12, спринт 5).
    # xlsx — read_only/write_only openpyxl (стриминг, константная память).
    "openpyxl==3.1.5",
    # xls (устаревший бинарный формат) — только этим и читается.
    "xlrd==2.0.1",
    # Детект кодировки (CP1251/UTF-8-BOM) для .csv — dop.md явно требует.
    "charset-normalizer==3.4.1",
    # lxml==5.3.0 не публикует колёса под cp314 и падает на сборке из
    # исходников без dev-пакетов libxml2/libxslt в контейнере — 6.1.3 их
    # публикует (тот же приём, что уже применён к pydantic/sqlalchemy/asyncpg
    # в этом файле). `iterparse` — стриминговый разбор выгрузки ЕГРЮЛ.
    "lxml==6.1.3",
    # ПЭП (спринт 6, dop.md §10). `bcrypt(code)` — именно так dop.md §10.4
    # п.11 требует хранить OTP-код: не `passlib`, чтобы не тащить обёртку
    # ради одного алгоритма.
    "bcrypt==4.2.1",
    # dop.md §10.4 п.1 требует Jinja2 → HTML → PDF. WeasyPrint (упомянут в
    # dop.md) тянет системные Pango/Cairo/GDK-Pixbuf — это прямо противоречит
    # принципу этого файла и Dockerfile («никаких системных пакетов», сборка
    # не должна зависеть от зеркал Debian). `xhtml2pdf` даёт тот же результат
    # (реальный PDF из HTML) на чистых manylinux-колёсах (reportlab, Pillow) —
    # осознанная замена инструмента при сохранении требования спеки. Кириллица
    # шрифтами PDF по умолчанию (Helvetica и т.д.) не поддерживается ни одним
    # из двух вариантов одинаково — шрифт с покрытием кириллицы (DejaVu Sans)
    # вложен в `app/assets/fonts/` и подключается через `@font-face`.
    "xhtml2pdf==0.2.20",
    "Jinja2==3.1.6",
    # Штамп на последней странице и склейка протокола (dop.md §10.4 п.19-20):
    # xhtml2pdf уже тянет pypdf транзитивно, пин здесь явный — импортируется
    # напрямую в `app.modules.signing.rendering`, а не только используется
    # xhtml2pdf внутри себя.
    "pypdf==6.19.0",
    # QR-код на странице протокола и на штампе документа, ссылка на
    # `/public/verify/{signature_id}` (dop.md §10.4 п.19, §10.5).
    "qrcode==8.2",
    # Доверенное время подписания (dop.md §10.8/§13: «внутренний NTP
    # обязателен в compose») — чистый Python, без C-расширений, протокол
    # NTPv3 клиентом к контейнеру `ntp`. `app/modules/signing/trusted_time.py`.
    "ntplib==0.4.0",
    # Отчётность (спринт 8, new_spec §2.3/§4.13): «серверный matplotlib (не
    # скриншот фронта — на сервере нет браузера)». Backend `Agg` — без
    # дисплея; вложенный DejaVu Sans уже покрывает кириллицу без
    # дополнительных шрифтов (та же гарнитура, что и в `signing.rendering`).
    # 3.10.0 (первый пин) реально ловит бесконечную рекурсию в
    # `Path.__deepcopy__` при отрисовке любых тиков осей под CPython 3.14
    # (хостовый venv, не образ контейнера — тот же класс проблемы, что
    # pydantic/sqlalchemy/asyncpg, см. project-overview) — 3.11.2 её не
    # воспроизводит, подтверждено локально.
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    # tests/test_api_smoke.py подменяет Redis: pytest.importorskip("fakeredis")
    # молча пропускал весь модуль без этой зависимости — сквозные тесты
    # никогда реально не запускались.
    "fakeredis==2.38.0",
    "ruff==0.8.6",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# В миграциях длинные строки — это DDL и SQL-литералы: разрыв по 100 символов
# делает их менее читаемыми, чем исходный SQL.
"migrations/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
