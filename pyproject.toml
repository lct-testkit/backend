[project]
name = "rtk-crm-api"
version = "0.1.0"
description = "CRM ИТ Школы Ростелекома — бэкенд (модульный монолит)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "redis==5.2.1",
    "httpx==0.28.1",
    "pyjwt[crypto]==2.10.1",
    "structlog==24.4.0",
    "prometheus-client==0.21.1",
    "arq==0.26.3",
    "python-multipart==0.0.20",
    "swagger-ui-bundle==1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "ruff==0.8.6",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# В миграциях длинные строки — это DDL и SQL-литералы: разрыв по 100 символов
# делает их менее читаемыми, чем исходный SQL.
"migrations/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
